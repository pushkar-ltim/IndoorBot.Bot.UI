<div class="ask-me-container">
    <div class="chat-history">
      <div *ngFor="let message of messages" class="message" [ngClass]="{'user-message': message.sender === 'user', 'bot-message': message.sender === 'bot'}">
        {{message.text}}
      </div>
    </div>
  
    <div class="input-area">
      <mat-form-field appearance="outline" class="message-input">
        <input matInput placeholder="Type your message here" [(ngModel)]="userQuery" (keyup.enter)="sendMessage()">
      </mat-form-field>
      <button mat-icon-button color="primary" (click)="sendMessage()" [disabled]="!userQuery">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  
    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </div>
